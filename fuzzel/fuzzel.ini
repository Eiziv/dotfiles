[main]
font=NotoSansM Nerd Font Propo:size=12
# Size fonts like GTK apps do (96 DPI) rather than by the monitors' real DPI,
# which made everything bigger.
dpi-aware=no
terminal=kitty
# Same icon theme as Qt/KDE (qt6ct, kdeglobals). Without it fuzzel mixes each
# app's own icon, in different styles and sizes.
icon-theme=Papirus-Dark
list-executables-in-path=yes
placeholder=Search...
line-height=36
lines=5
width=45
horizontal-pad=25
vertical-pad=25
inner-pad=10

# RRGGBBAA. Same near-transparent black as Waybar and the control centre, over
# Hyprland's blur (the "launcher" layer rule).
[colors]
background=0000001a
text=f2f2f2cc
prompt=f2f2f2cc
input=f2f2f2ff
placeholder=f2f2f2cc
match=f4d69fff
selection=0000001a
selection-text=f2f2f2ff
selection-match=f4d69fff
counter=f2f2f2cc

# Panel 20, rows inside it 10, like the control centre.
[border]
width=0
radius=20
selection-radius=10
