# Lock screen, styled to match the greetd login screen (/etc/greetd/style.css):
# same bamboo wallpaper, translucent black boxes, #eee text, rounding 10.

$font = NotoSans Nerd Font
$text = rgb(238, 238, 238)
$box = rgba(0, 0, 0, 0.2)

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg
    # Light blur + dim so the text stays readable over the leaves,
    # like the blurred panel behind the login box.
    blur_passes = 2
    blur_size = 5
    brightness = 0.75
}

# Clock
label {
    monitor = HDMI-A-2
    text = <span font_weight="light">$TIME</span>
    color = $text
    font_family = $font
    font_size = 110
    position = 0, 170
    halign = center
    valign = center
}

# Date
label {
    monitor = HDMI-A-2
    text = cmd[update:60000] date +"%A %-d %B"
    color = rgba(238, 238, 238, 0.75)
    font_family = $font
    font_size = 18
    position = 0, 70
    halign = center
    valign = center
}

# Password box
input-field {
    monitor = HDMI-A-2
    size = 320, 50
    rounding = 10
    outline_thickness = 0
    inner_color = $box
    outer_color = rgba(0, 0, 0, 0)
    check_color = rgba(170, 255, 255, 0.5)
    fail_color = rgba(255, 107, 107, 0.6)
    capslock_color = rgba(244, 214, 159, 0.5)
    font_color = $text
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##eeeeeeaa">Password</span>
    fail_text = <span foreground="##eeeeee">$FAIL ($ATTEMPTS)</span>
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    position = 0, -60
    halign = center
    valign = center
}

# User
label {
    monitor = HDMI-A-2
    text = $USER
    color = $text
    font_family = $font
    font_size = 15
    position = 0, 0
    halign = center
    valign = center
}
